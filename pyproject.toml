[tool.ruff]
# TA-125: minimal config to start, deliberately -- target-version and
# line-length only, no custom [tool.ruff.lint] select. Ruff's built-in
# default rule set (E4, E7, E9, F) is itself a conservative, sensible
# starting point; broadening it is a separate decision once this
# baseline is clean, not something to bundle into standing this up.
target-version = "py312"
line-length = 110
# .agents/ carries its own scripts (Claude Code skill tooling), not
# this project's source -- ruff would otherwise lint code this team
# didn't write and can't fix here.
extend-exclude = [".agents"]

[tool.ruff.lint.per-file-ignores]
# Every test module in this suite deliberately puts `pytestmark =
# pytest.mark.unit/integration` right after `import pytest`, before
# the rest of its imports -- an established, consistent convention
# across the whole directory (see any file in backend/tests/), not an
# accident. Reordering ~50 files' imports just to satisfy E402 would
# be pure churn for a style ruff doesn't have an opinion worth
# overriding here; scoped to this one directory + rule, not a blanket
# ignore of E402 project-wide.
"backend/tests/*.py" = ["E402"]
# sys.path.insert(...) has to run before the local imports that depend
# on it -- the standard idiom for a script invoked from outside its
# package, not an ordering mistake.
"scripts/cleanup_e2e_run.py" = ["E402"]

[tool.coverage.run]
# TA-126: the app packages actually under test -- not backend/tests
# itself (that would count test code executing its own lines as
# "coverage") and not alembic/versions (migration files pytest never
# runs; counting them would just be a permanent, meaningless drag on
# the number).
source = ["backend", "ai", "data_pipeline"]
omit = [
    "backend/tests/*",
    "backend/alembic/versions/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
# TA-126: measured baseline on commit c91d8d9, 2026-09-22 (clean run,
# db volume reset first -- see the ticket): 1696 stmts, 595 miss, 64.92%
# total. Set just below that so the current suite passes but any future
# drop fails the build. A ratchet, not a target -- raise it as real
# coverage goes up; lowering it needs a stated reason.
fail_under = 64

[tool.pytest.ini_options]
# TA-79: makes the suite resolve first-party imports the same way
# outside Docker as the Dockerfile's ENV PYTHONPATH does inside it --
# "." for ai.X / data_pipeline.X package imports, "backend" for
# backend's own flat imports (database, models, auth.*, ...). No
# sys.path manipulation in any test file needed either way.
pythonpath = [".", "backend"]
testpaths = ["backend/tests"]
addopts = "--strict-markers"
markers = [
    "unit: fast unit tests with no DB or Docker dependency",
    "integration: tests requiring database and FastAPI TestClient",
    "large_upload: integration tests that push a real ~10MB payload through the endpoint -- confirmed to hang indefinitely under `pytest --cov` (a coverage/threading interaction, not an app bug; every other test using the same threaded TestClient fixture is unaffected). Run without --cov, in a separate CI step, per TA-126.",
]
