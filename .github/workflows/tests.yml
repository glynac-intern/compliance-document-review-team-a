name: Tests and Deploy

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=compliance_user
          POSTGRES_PASSWORD=ci_test_password
          POSTGRES_DB=compliance_db
          DATABASE_URL=postgresql://compliance_user:ci_test_password@db:5432/compliance_db
          LLM_PROVIDER=gemini
          LLM_API_KEY=ci_dummy_key_not_used_by_tests
          BACKEND_SECRET_KEY=ci_dummy_secret_for_testing_only
          BACKEND_PORT=8000
          NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
          EOF

      - name: Build backend image
        run: docker compose build backend

      # TA-80: same path the README uses, seeding skipped -- CI's
      # dummy LLM_API_KEY can't make real embedding calls, which
      # pytest doesn't need anyway.
      - name: Run setup script
        run: SKIP_SEEDING=1 ./scripts/setup.sh

      - name: Run test suite (role boundary + masker)
        run: docker compose run --rm backend pytest backend/tests/ -v

      - name: Tear down
        if: always()
        run: docker compose down -v

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # A real production build needs this set -- matches what an
          # actual deployment requires, not a CI-only workaround.
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build

      - name: Run frontend tests (once they exist)
        run: npm test --if-present

  deploy:
    needs: [test, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/compliance-document-review-team-a
            git pull origin main
            docker compose up -d db backend
            docker compose run --rm backend alembic -c backend/alembic.ini upgrade head
            echo "Deploy complete"
