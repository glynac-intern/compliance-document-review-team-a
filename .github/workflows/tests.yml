name: Tests and Deploy

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=compliance_user
          POSTGRES_PASSWORD=ci_test_password
          POSTGRES_DB=compliance_db
          DATABASE_URL=postgresql://compliance_user:ci_test_password@db:5432/compliance_db
          LLM_PROVIDER=gemini
          LLM_API_KEY=ci_dummy_key_not_used_by_tests
          BACKEND_SECRET_KEY=ci_dummy_secret_for_testing_only
          BACKEND_PORT=8000
          NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
          EOF

      - name: Build backend image
        run: docker compose build backend

      # TA-125: static analysis only, no DB/services needed -- runs
      # right after the image builds rather than after setup, so a
      # lint failure fails fast instead of waiting on migrations.
      - name: Lint (ruff)
        run: docker compose run --rm backend ruff check .

      # TA-80: same path the README uses, seeding skipped -- CI's
      # dummy LLM_API_KEY can't make real embedding calls, which
      # pytest doesn't need anyway.
      - name: Run setup script
        run: SKIP_SEEDING=1 ./scripts/setup.sh

      # TA-126: --cov-fail-under=0 overrides pyproject.toml's fail_under
      # for THIS step only -- pytest-cov checks fail_under against
      # whatever it's measured so far every time --cov runs a report,
      # so without the override the unit-only slice (~40%) would fail
      # the build on its own before the integration step ever adds its
      # share. The real threshold is enforced once, against the true
      # combined total, in the dedicated "Coverage report" step below.
      - name: Run unit test suite
        run: docker compose run --rm backend pytest -m unit -v --cov --cov-fail-under=0

      # TA-126: --cov-append onto the same .coverage file the unit run
      # just wrote -- the bind mount (docker-compose.yml's `.:/app` on
      # the backend service) is what makes that file visible to this
      # separate `docker compose run` invocation at all; source/omit
      # come from pyproject.toml, not flags here. --cov-fail-under=0
      # for the same reason as the unit step: this slice alone is still
      # short of the full combined total.
      #
      # Tests marked `large_upload` are deliberately excluded here: two
      # tests in test_ta85_upload_boundaries.py push a real ~10MB
      # payload through the full ASGI TestClient stack, and BOTH
      # reproducibly HANG under --cov (confirmed: ran 10+ minutes with
      # zero progress, only exited once the container was force-killed
      # at the Docker daemon level -- a real hang, not just slow).
      # Every other test using the identical threaded `client` fixture
      # runs fine under --cov, and these exact tests run fine WITHOUT
      # --cov (verified repeatedly this session) -- a coverage-tooling/
      # threading interaction under load, not an app bug. Run
      # separately, uninstrumented, in the next step instead, so they
      # stay exercised every CI run. See the `large_upload` marker's
      # own docstring in pyproject.toml.
      - name: Run integration test suite
        run: docker compose run --rm backend pytest -m "integration and not large_upload" -v --cov --cov-append --cov-fail-under=0

      # TA-126: the large_upload-marked tests excluded above, run
      # normally (no --cov) so they're still verified every CI run.
      - name: Run large-upload boundary tests (uninstrumented)
        run: docker compose run --rm backend pytest -m large_upload -v

      # TA-126: fails the job if under pyproject.toml's fail_under --
      # deliberately not passed again here, so there's exactly one
      # place the threshold is set. Always writes the job summary
      # (even on failure) so the number is visible without opening the
      # raw log, per the ticket's acceptance criteria.
      - name: Coverage report
        if: always()
        run: |
          set +e
          docker compose run --rm backend coverage report -m > coverage-report.txt
          STATUS=$?
          set -e
          {
            echo "### Backend coverage"
            echo '```'
            cat coverage-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat coverage-report.txt
          exit $STATUS

      - name: Tear down
        if: always()
        run: docker compose down -v

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        env:
          # A real production build needs this set -- matches what an
          # actual deployment requires, not a CI-only workaround.
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build

      - name: Run frontend tests
        run: npm test

      # TA-126: thresholds live in vitest.config.ts's coverage block,
      # not duplicated as a flag here. Same always-write-the-summary
      # shape as the backend's coverage step, so a regression is
      # visible without opening the raw log either way.
      - name: Coverage report
        if: always()
        run: |
          set +e
          npm run test:coverage > coverage-report.txt 2>&1
          STATUS=$?
          set -e
          {
            echo "### Frontend coverage"
            echo '```'
            tail -8 coverage-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat coverage-report.txt
          exit $STATUS

  # TA-127: its own job, not extra steps bolted onto `test`/`test-frontend`
  # -- a scanner finding then fails a distinctly-named job in the Actions
  # UI ("dependency-scan") instead of showing up as one more red step
  # inside a job called "test", which is exactly what the ticket's
  # "distinguishable from test failures" acceptance criterion is about.
  dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=compliance_user
          POSTGRES_PASSWORD=ci_test_password
          POSTGRES_DB=compliance_db
          DATABASE_URL=postgresql://compliance_user:ci_test_password@db:5432/compliance_db
          LLM_PROVIDER=gemini
          LLM_API_KEY=ci_dummy_key_not_used_by_tests
          BACKEND_SECRET_KEY=ci_dummy_secret_for_testing_only
          BACKEND_PORT=8000
          NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
          EOF

      - name: Build backend image
        run: docker compose build backend

      # TA-127: any finding not explicitly ignored fails the build --
      # deliberate, not the tool default left unexamined (pip-audit has
      # no severity field reliable enough across the Python advisory
      # data to threshold on the way npm's --audit-level can). Ignored
      # IDs and the reasoning behind each live in
      # .github/pip-audit-ignore.txt and SECURITY.md, not inline here,
      # so a new accepted risk doesn't mean editing workflow YAML.
      - name: Dependency vulnerability scan -- backend (pip-audit)
        if: always()
        run: |
          set +e
          IGNORE_FLAGS=$(grep -vE '^\s*(#|$)' .github/pip-audit-ignore.txt | sed 's/^/--ignore-vuln /' | tr '\n' ' ')
          docker compose run --rm backend sh -c "pip install --quiet pip-audit && pip-audit -r backend/requirements.txt $IGNORE_FLAGS" > pip-audit-report.txt
          STATUS=$?
          set -e
          {
            echo "### Dependency scan: backend (pip-audit)"
            echo '```'
            cat pip-audit-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat pip-audit-report.txt
          exit $STATUS

      - name: Tear down backend
        if: always()
        run: docker compose down -v

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # TA-127: --audit-level=high is the deliberate threshold per the
      # ticket -- moderate-and-below findings still print in the job
      # summary/log below, they just don't fail the build.
      - name: Dependency vulnerability scan -- frontend (npm audit)
        if: always()
        working-directory: frontend
        run: |
          set +e
          npm ci
          npm audit --audit-level=high > npm-audit-report.txt
          STATUS=$?
          set -e
          {
            echo "### Dependency scan: frontend (npm audit)"
            echo '```'
            cat npm-audit-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat npm-audit-report.txt
          exit $STATUS

      # TA-127: the root package.json/package-lock.json is the
      # Playwright e2e suite (test-e2e job) -- a separate manifest from
      # frontend/'s, so it needs its own audit rather than being
      # assumed covered by the frontend one above.
      - name: Dependency vulnerability scan -- e2e suite (npm audit)
        if: always()
        run: |
          set +e
          npm ci
          npm audit --audit-level=high > npm-audit-e2e-report.txt
          STATUS=$?
          set -e
          {
            echo "### Dependency scan: e2e suite (npm audit)"
            echo '```'
            cat npm-audit-e2e-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat npm-audit-e2e-report.txt
          exit $STATUS

  test-e2e:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=compliance_user
          POSTGRES_PASSWORD=ci_test_password
          POSTGRES_DB=compliance_db
          DATABASE_URL=postgresql://compliance_user:ci_test_password@db:5432/compliance_db
          LLM_PROVIDER=gemini
          LLM_API_KEY=ci_dummy_key_not_used_by_tests
          BACKEND_SECRET_KEY=ci_dummy_secret_for_testing_only
          BACKEND_PORT=8000
          NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
          EOF

      - name: Build stack images
        run: docker compose build backend frontend

      - name: Run setup script (migrations)
        run: SKIP_SEEDING=1 ./scripts/setup.sh

      - name: Start frontend
        run: docker compose up -d frontend

      - name: Wait for service readiness
        run: |
          echo "Waiting for backend readiness on http://localhost:8000..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/docs | grep -q "200"; then
              echo "Backend is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Backend failed to become ready"
              exit 1
            fi
            sleep 2
          done

          echo "Waiting for frontend readiness on http://localhost:3000..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/login | grep -q "200"; then
              echo "Frontend is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Frontend failed to become ready"
              exit 1
            fi
            sleep 2
          done

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
          BACKEND_API_URL: http://localhost:8000
          CI: "true"

      - name: Upload Playwright report & traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose down -v

  deploy:
    needs: [test, test-frontend, dependency-scan, test-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/compliance-document-review-team-a
            git pull origin main
            docker compose build backend frontend
            docker compose up -d db backend frontend caddy
            docker compose run --rm backend alembic -c backend/alembic.ini upgrade head
            echo "Deploy complete"
