# TA-127: keeps dependency updates arriving as reviewable PRs on a
# schedule, instead of a manual sweep nobody remembers to run. Each
# ecosystem entry matches a lockfile/manifest actually in this repo --
# see the directory comments below for what lives where.
version: 2
updates:
  # backend/requirements.txt
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    ignore:
      # bcrypt 4.1+ breaks passlib 1.7.4's bcrypt backend-detection
      # self-test (it reads bcrypt's now-removed __about__ module and
      # raises instead of the old silent-truncate behavior on its
      # internal >72-byte test payload) -- confirmed by a real failing
      # CI run on the PR this bump opened. Pinned at 4.0.1 deliberately;
      # see the comment next to the pin in backend/requirements.txt.
      - dependency-name: "bcrypt"
        update-types: ["version-update:semver-major"]

  # frontend/package.json (the app itself)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      # react and react-dom must be the exact same version (React
      # enforces this at runtime) -- without this, Dependabot opens
      # them as two separate PRs, and merging either alone breaks the
      # app. Confirmed: two such PRs failed CI this way before this
      # rule existed.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  # root package.json -- Playwright e2e suite (test-e2e job), a
  # separate manifest/lockfile from frontend/'s
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # backend/Dockerfile
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"

  # frontend/Dockerfile
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  # .github/workflows/tests.yml's actions/*, appleboy/ssh-action, etc.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
