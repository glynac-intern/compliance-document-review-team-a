services:
  db:
    image: pgvector/pgvector:pg16
    container_name: compliance_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      # TA-79: repo root, not ./backend -- backend/, ai/, and
      # data_pipeline/ need to land in the image/container as true
      # siblings (matching the real repo layout), not with ai/
      # data_pipeline reparented under backend's own root.
      context: .
      dockerfile: backend/Dockerfile
    container_name: compliance_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # TA-81: found via a real clean-checkout rehearsal -- .env.example
      # used to ship DATABASE_URL as a literal string with its own
      # hardcoded password, separate from POSTGRES_PASSWORD. The README
      # tells a new team member to set POSTGRES_PASSWORD to "any value",
      # but env_file does no variable substitution, so DATABASE_URL kept
      # whatever password was literally written in .env -- silently
      # desyncing the moment someone actually changed POSTGRES_PASSWORD,
      # with a Postgres auth failure that gives no hint the .env edit
      # they just made is the cause. Building it here from the same
      # POSTGRES_* vars the db service uses makes drift impossible.
      # `environment:` takes precedence over `env_file:` for the same
      # key, so this always wins over any DATABASE_URL left in .env.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # TA-79: one mount of the repo root instead of four overlapping
      # ones -- ai/, data_pipeline/, seed/, and backend/ all land at
      # their real, sibling paths under /app, so nothing needs
      # reparenting via sys.path hacks to find them.
      - .:/app
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* vars are baked into the JS bundle at `next build`
      # time, not read at container start -- passing it as a build arg
      # (sourced from .env, same mechanism the backend's DATABASE_URL
      # substitution above already relies on) is the only way it
      # actually reaches the production bundle.
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    container_name: compliance_frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    # No source bind mount here (unlike backend) -- this service runs a
    # real `next build` + `next start` baked into the image, not `next
    # dev` against live-mounted source. A bind mount would shadow that
    # build with whatever's on the host, and defeat the point of it.

  # TA-89: sole public entry point. backend/frontend keep their `ports:`
  # above for local dev convenience, but on a real deployment those
  # ports must be closed at the firewall/NSG level -- only 80/443 should
  # be reachable from the internet. Caddy gets automatic HTTPS for free
  # for any real hostname in PUBLIC_HOST (a free one via sslip.io works
  # fine -- Let's Encrypt just can't issue a cert for a bare IP).
  caddy:
    image: caddy:2-alpine
    container_name: compliance_caddy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  db_data:
  uploads_data:
  caddy_data:
  caddy_config:
